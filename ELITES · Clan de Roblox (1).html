<style>
:root{
  --bg:#f5f8fa;--line:rgba(8,30,46,.16);--text:#0b1b27;--muted:#5a6f7f;--accent:#0a86c4;
  --head:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05090e;--line:rgba(255,255,255,.13);--text:#e6eef4;--muted:#7d91a1;--accent:#6cc6ee}}
:root[data-theme="dark"]{--bg:#05090e;--line:rgba(255,255,255,.13);--text:#e6eef4;--muted:#7d91a1;--accent:#6cc6ee}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.65;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:0 28px}
a{color:inherit;text-decoration:none}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 28px 18px;background:var(--bg);opacity:0;transition:opacity .6s .3s}
body.entered nav{opacity:1}
.mark{font:700 1.15rem var(--head);letter-spacing:.28em}
#sw{display:flex;gap:4px;align-items:center;font:600 .74rem var(--body);letter-spacing:.16em;color:var(--muted)}
#sw button{font:inherit;letter-spacing:inherit;border:0;background:none;color:inherit;padding:4px 6px;cursor:pointer;transition:color .25s}
#sw button.on,#sw button:hover{color:var(--accent)}
/* gate */
body:not(.entered){overflow:hidden}
#gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);transition:opacity .7s,visibility .7s}
#gate.out{opacity:0;visibility:hidden}
#gate p{font:500 .72rem var(--body);letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin:10px 0 34px}
.langs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.langs button{font:600 .8rem var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--text);background:none;border:1px solid var(--line);border-radius:99px;padding:13px 34px;cursor:pointer;transition:border-color .3s,color .3s}
.langs button:hover{border-color:var(--accent);color:var(--accent)}
/* title */
.title{font-family:var(--head);font-weight:700;letter-spacing:.2em;line-height:.95;text-transform:uppercase;
  background:linear-gradient(100deg,var(--accent) 0%,var(--text) 50%,var(--accent) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* hero */
header{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:110px 28px 80px}
body:not(.entered) header *,body:not(.entered) .rule{animation-play-state:paused}
header .title{font-size:clamp(4rem,18vw,9.5rem);margin-bottom:26px;padding-left:.2em;animation:up 1s both,shine 8s linear infinite}
.rule{width:56px;height:1px;background:var(--accent);margin:0 auto 26px;transform-origin:center;animation:grow 1s .5s both}
.sub{font:500 .86rem var(--body);letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:46px;animation:up 1s .3s both}
.pill{display:inline-block;font:600 .8rem var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--text);border:1px solid var(--accent);border-radius:99px;padding:14px 42px;transition:background .35s,color .35s}
.pill:hover{background:var(--accent);color:var(--bg)}
header .pill{animation:up 1s .5s both}
/* sections */
section{padding:110px 0 0}
.label{font:500 .72rem var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
h2{font:600 clamp(2.2rem,6vw,3.4rem) var(--head);letter-spacing:.1em;text-transform:uppercase;line-height:1.05}
.lead{color:var(--muted);margin-top:12px}
.about{display:grid;grid-template-columns:5fr 7fr;gap:64px;align-items:center}
.about .big{font:400 clamp(1.25rem,2.6vw,1.65rem)/1.5 var(--body)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
/* roster */
.roster{margin-top:48px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:56px 84px 1fr auto;align-items:center;gap:26px;padding:26px 6px;border-bottom:1px solid var(--line);transition:padding .4s,background .4s}
.row:hover{padding-left:22px}
.num{font:500 1.1rem var(--head);letter-spacing:.2em;color:var(--muted);transition:color .3s}
.row img{width:84px;height:84px;border-radius:50%;object-fit:cover;filter:grayscale(.7);transition:filter .5s,transform .5s}
.row:hover img{filter:none;transform:scale(1.05)}
.row h3{font:600 clamp(1.5rem,4vw,2.2rem) var(--head);letter-spacing:.1em;word-break:break-all;transition:color .3s}
.row:hover h3,.row:hover .num{color:var(--accent)}
.go{font:500 .7rem var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap;transition:color .3s}
.go::after{content:"  \2192";display:inline-block;transition:transform .35s}
.row:hover .go{color:var(--accent)}
.row:hover .go::after{transform:translateX(6px)}
.statement{margin:96px auto 0;max-width:720px;text-align:center;font:500 clamp(1.5rem,4vw,2.4rem)/1.25 var(--head);letter-spacing:.08em;text-transform:uppercase}
.statement span{color:var(--accent)}
/* closing */
.closing{margin-top:110px;padding:70px 0;border-top:1px solid var(--line);text-align:center}
.closing p{color:var(--muted);margin:12px 0 30px}
footer{padding:30px 28px calc(36px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font:500 .7rem var(--body);letter-spacing:.24em;text-transform:uppercase;border-top:1px solid var(--line)}
@media (max-width:760px){.about{grid-template-columns:1fr;gap:28px}.row{grid-template-columns:36px 64px 1fr;gap:16px}.row img{width:64px;height:64px}.go{grid-column:3;margin-top:-6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
